# Phase 1: Open WebUI on localhost, talking to Ollama running natively on the Mac.
# Start:  docker compose up -d      Open: http://localhost:3000
# Stop:   docker compose down       (chats and settings stay in the open-webui volume)
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      # Bound to this Mac only, because sign-in is switched off below.
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Ollama runs as the native Mac app (for GPU access), not in Docker.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      # Single-user spike: no login screen. Sign-in comes back in Phase 2 (Entra).
      # This cannot be flipped later without deleting the open-webui volume.
      WEBUI_AUTH: "False"
    volumes:
      - open-webui:/app/backend/data
      # ComfyUI's image folder on the Mac (output, input, temp), shared so the "Delete images"
      # buttons (functions/delete_images.py) can empty it. Remove this line if ComfyUI is not installed.
      - ${HOME}/ComfyUI-data:/comfyui

volumes:
  open-webui:
